# Base PostgreSQL pour le développement local uniquement.
# Les identifiants ci-dessous ne protègent qu'une base jetable, exposée
# sur 127.0.0.1 : ce ne sont pas des secrets. En production, voir DEPLOY.md
# (Cloud SQL + Secret Manager).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: portail_dev
      POSTGRES_DB: portail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portail -d portail"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
